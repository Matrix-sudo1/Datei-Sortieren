name: Tests

on:
  push:
    branches: ["main", "v8-refactor", "v8.2-json-api"]
  pull_request:
    branches: ["main"]

jobs:
  bash-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        run: bash tests/test_regression.sh
      - name: Verify API syntax
        run: python3 -m py_compile api.py
