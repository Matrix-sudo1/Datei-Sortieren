name: Tests

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  bash-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        run: bash tests/test_regression.sh
      - name: Run release hardening tests
        run: bash tests/test_phase10_release_hardening.sh
      - name: Verify API syntax
        run: python3 -m py_compile api.py
